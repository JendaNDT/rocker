name: Publish verified Windows candidate

on:
  push:
    branches: [windows-native-prototype]
    paths:
      - '.github/workflows/publish-windows-prototype.yml'
      - 'docs/windows/releases/current.json'
      - 'docs/windows/releases/notes.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Verify successful build and download its packages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          run_id=$(jq -r '.runId' docs/windows/releases/current.json)
          commit=$(jq -r '.commit' docs/windows/releases/current.json)
          tag=$(jq -r '.tag' docs/windows/releases/current.json)
          gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" > /tmp/release-ref.json
          jq -e --arg commit "$commit" '.object.type == "commit" and .object.sha == $commit' /tmp/release-ref.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id" > /tmp/build-run.json
          jq -e --arg commit "$commit" '.conclusion == "success" and .head_sha == $commit and .path == ".github/workflows/windows-prototype.yml" and .head_branch == "windows-native-prototype"' /tmp/build-run.json
          gh api "repos/$GITHUB_REPOSITORY" --jq '.private' | grep -qx true
          gh run download "$run_id" --repo "$GITHUB_REPOSITORY" -n Rocker-Windows-downloads -D /tmp/rocker-downloads
          gh run download "$run_id" --repo "$GITHUB_REPOSITORY" -n Windows-build-reports -D /tmp/rocker-reports
          cd /tmp/rocker-downloads
          sha256sum --check SHA256SUMS.txt
      - name: Verify archive contents and matching source revisions
        run: |
          python3 - <<'PY'
          import io, json, struct, zipfile
          from pathlib import Path
          selection = json.loads(Path('docs/windows/releases/current.json').read_text())
          root = Path('/tmp/rocker-downloads')
          report = json.loads(Path('/tmp/rocker-reports/candidate-validation.json').read_text(encoding='utf-8-sig'))
          assert report['result'] == 'passed' and report['sourceCommit'] == selection['commit']
          assert report['windowsRun'].endswith('/' + str(selection['runId']))
          assert report['nativeWorkspaces'] == 32 and report['nativeSuites'] == 22
          setup = root / report['installer']
          assert setup.read_bytes()[:2] == b'MZ'
          installer = json.loads(Path('/tmp/rocker-reports/installer/installer-smoke.json').read_text(encoding='utf-8-sig'))
          assert installer['result'] == 'passed'
          for field in ['versionTransitionPreservedDataAndPriorBinary','failedUpdatePreservedShortcutAndAssociation',
                        'exactDllRepair','installedInventoryMatchesPortableArchive','preUpdateFullBackupAndRawDatabase','unicodeProjectActivation',
                        'uninstallPreservedDatabaseAndSentinel']:
              assert installer[field] is True, field
          with zipfile.ZipFile(root / 'Rocker-Windows-x64.zip') as package:
              assert package.testzip() is None
              info = json.loads(package.read('build-info.json'))
              assert info['commit'] == selection['commit']
              assert setup.name == 'Rocker-Windows-Setup-' + info['toolchain']['productVersion'] + '-x64.exe'
              assert info['runUrl'].endswith('/' + str(selection['runId']))
              assert info['checkedWindow']['result'] == 'passed'
              assert info['checkedWindow']['exitCode'] == 0
              assert info['checkedWindow']['nativeNotationVerified'] is True
              assert info['checkedNotation']['result'] == 'passed'
              names = {n.lower() for n in package.namelist()}
              assert not any('rocker_audio_test' in n for n in names)
              for name in ['Rocker.Probe.exe', 'rocker_audio.dll', 'Microsoft.UI.Xaml.dll', 'coreclr.dll',
                           'hostfxr.dll', 'hostpolicy.dll', 'Rocker.Probe.pri', 'CTI-ME.txt',
                           'AlphaTab.dll', 'AlphaSkia.dll', 'libalphaskia.dll', 'Rocker.Notation.dll',
                           'fixtures/notation-scale.musicxml', 'fixtures/notation-phrases.gp',
                           'licenses/alphatab-license.txt', 'licenses/alphaskia-license.txt',
                           'licenses/bravura-license.txt', 'licenses/noto-sans-license.txt',
                           'component-manifest.json', 'PwaMigration/helper.html', 'help/user-guide.txt',
                           'licenses/pwa-exporter-MIT.txt', 'licenses/inno-setup-license.txt']:
                  assert name.lower() in names, name
              for name in ['Rocker.Probe.exe', 'rocker_audio.dll', 'libalphaskia.dll']:
                  data = package.read(name)
                  offset = struct.unpack_from('<I', data, 0x3c)[0]
                  assert data[:2] == b'MZ' and data[offset:offset+4] == b'PE\0\0'
                  assert struct.unpack_from('<H', data, offset+4)[0] == 0x8664
              import hashlib
              manifest = json.loads(package.read('component-manifest.json'))
              assert manifest['separateCorrespondingSources'] is True and manifest['publishedBinaries']
              for binary in manifest['publishedBinaries']:
                  assert hashlib.sha256(package.read(binary['path'])).hexdigest() == binary['sha256'], binary['path']
          with zipfile.ZipFile(root / 'Rocker-Windows-sources.zip') as sources:
              assert sources.testzip() is None
              for name, revision in [('rocker-source.zip', info['commit']), ('JUCE-source.zip', info['juceCommit']),
                                     ('AlphaTab-source.zip', info['alphaTabCommit']), ('AlphaSkia-source.zip', info['alphaSkiaCommit']),
                                     ('Signalsmith-Stretch-source.zip', info['signalsmithStretchCommit']),
                                     ('Signalsmith-Linear-source.zip', info['signalsmithLinearCommit']),
                                     ('libwebm-source.zip', info['libwebmCommit'])]:
                  with zipfile.ZipFile(io.BytesIO(sources.read(name))) as archive:
                      assert archive.testzip() is None
                      assert archive.comment.decode() == revision
          with zipfile.ZipFile(root / 'Rocker-Windows-desktop-gallery.zip') as gallery:
              assert gallery.testzip() is None
              data = json.loads(gallery.read('gallery-data.json'))
              assert data['sourceCommit'] == selection['commit'] and str(data['runId']) == str(selection['runId'])
              assert len(data['views']) == 32
              assert len([n for n in gallery.namelist() if n.endswith('.png')]) == 64
              assert 'gallery.html' in gallery.namelist() and 'gallery.js' in gallery.namelist() and 'gallery.css' in gallery.namelist()
          print('PASS: complete Windows candidate, 64 desktop captures, installer checks, binary hashes, ZIP integrity and seven corresponding source revisions.')
          PY
      - name: Publish private repository prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag=$(jq -r '.tag' docs/windows/releases/current.json)
          commit=$(jq -r '.commit' docs/windows/releases/current.json)
          installer=$(jq -r ' .installer' /tmp/rocker-reports/candidate-validation.json)
          title=$(jq -r '.title' docs/windows/releases/current.json)
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json isDraft > /tmp/existing-release.json; then
            jq -e '.isDraft == true' /tmp/existing-release.json
            gh release upload "$tag" "/tmp/rocker-downloads/$installer" /tmp/rocker-downloads/Rocker-Windows-x64.zip /tmp/rocker-downloads/Rocker-Windows-sources.zip /tmp/rocker-downloads/Rocker-Windows-desktop-gallery.zip /tmp/rocker-downloads/SHA256SUMS.txt /tmp/rocker-reports/candidate-validation.json \
              --repo "$GITHUB_REPOSITORY"
            gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --draft=false
          else
            gh release create "$tag" "/tmp/rocker-downloads/$installer" /tmp/rocker-downloads/Rocker-Windows-x64.zip /tmp/rocker-downloads/Rocker-Windows-sources.zip /tmp/rocker-downloads/Rocker-Windows-desktop-gallery.zip /tmp/rocker-downloads/SHA256SUMS.txt /tmp/rocker-reports/candidate-validation.json \
              --repo "$GITHUB_REPOSITORY" --verify-tag --title "$title" --notes-file docs/windows/releases/notes.md --prerelease
          fi
