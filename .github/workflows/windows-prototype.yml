name: Windows native candidate

on:
  push:
    branches: [windows-native-prototype]
    paths:
      - 'windows/**'
      - 'scripts/export-windows-content.mjs'
      - 'scripts/export-windows-migration-fixture.mjs'
      - 'src/lib/migrationArchive.ts'
      - 'docs/windows/w12/**'
      - 'scripts/export-windows-domain-reference.mjs'
      - 'docs/windows/w06/domain-reference.json'
      - 'src/lib/**'
      - 'src/audio/tunings.ts'
      - '.github/workflows/windows-prototype.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-prototype-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-2025
    timeout-minutes: 35
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          global-json-file: windows/global.json
      - name: Build and test on Windows
        run: |
          $ErrorActionPreference = 'Stop'
          git config --global core.longpaths true
          python -m pip install --disable-pip-version-check cmake==3.31.10
          if ($LASTEXITCODE -ne 0) { throw 'CMake installation failed.' }
          $scripts = python -c "import sysconfig; print(sysconfig.get_path('scripts'))"
          $env:PATH = "$scripts;$env:PATH"
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vs) { throw 'MSVC x64 build tools are missing.' }
          Import-Module "$vs\Common7\Tools\Microsoft.VisualStudio.DevShell.dll"
          Enter-VsDevShell -VsInstallPath $vs -SkipAutomaticLocation -DevCmdArguments '-arch=amd64 -host_arch=amd64'
          ./windows/build.ps1
      - name: Ensure the official WebView2 runtime for the UI check
        run: ./windows/ensure-webview-runtime.ps1
      - name: Check the published application opens and closes
        run: |
          ./windows/smoke.ps1
          ./windows/smoke.ps1 -WorkspaceView components -ReportDirectory (Join-Path $PWD 'windows/out/reports/components')
      - name: Package application and corresponding sources separately
        run: ./windows/package.ps1
      - name: Verify per-user install, repair, file activation and uninstall
        run: ./windows/installer/smoke.ps1
      - name: Check complete candidate evidence
        run: ./windows/verify-candidate.ps1
      - name: Upload verified candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Rocker-Windows-downloads
          path: windows/out/packages/
          if-no-files-found: error
          retention-days: 30
      - name: Upload build evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Windows-build-reports
          path: windows/out/reports/
          if-no-files-found: warn
          retention-days: 30
      - name: Upload debug symbols separately
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Windows-debug-symbols
          path: |
            windows/out/native/rocker_audio.pdb
            windows/out/probe/*.pdb
          if-no-files-found: error
          retention-days: 30
